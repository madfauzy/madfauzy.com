<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f141f"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5"/>

  <!-- Glowing Core -->
  <circle cx="50" cy="50" r="28" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Backend Concept 1: Terminal Prompt >_ morphing into Distributed Database Node -->
  <!-- Prompt Chevron > -->
  <path d="M 28 32 L 44 48 L 28 64" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Server / Data Cursor _ -->
  <rect x="52" y="60" width="20" height="7" rx="3.5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Micro Binary / Node indicators at top-right -->
  <circle cx="68" cy="28" r="4" fill="#10b981"/>
  <circle cx="56" cy="28" r="3" fill="#6366f1" opacity="0.6"/>
</svg>
