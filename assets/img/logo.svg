<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="32" fill="url(#glow)"/>

  <!-- Top Cylinder Cap -->
  <ellipse cx="50" cy="30" rx="25" ry="9" fill="url(#diskGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <ellipse cx="50" cy="30" rx="13" ry="4.5" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="50" cy="30" r="2.5" fill="#10b981"/>

  <!-- Middle Tier -->
  <path d="M 25 30 V 48 C 25 54 75 54 75 48 V 30" fill="url(#diskGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 25 48 C 25 54 75 54 75 48" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Tier -->
  <path d="M 25 48 V 66 C 25 72 75 72 75 66 V 48" fill="url(#diskGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Status LED dots on right side of disks -->
  <circle cx="68" cy="40" r="2" fill="#10b981"/>
  <circle cx="68" cy="58" r="2" fill="#38bdf8"/>

  <!-- Live Pulse Beacon -->
  <circle cx="50" cy="18" r="3" fill="#10b981"/>
  <line x1="50" y1="18" x2="50" y2="21" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
