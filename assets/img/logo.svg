<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg_clean" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091410"/>
      <stop offset="100%" stop-color="#030906"/>
    </linearGradient>
    <linearGradient id="border_clean" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="braceGrad_clean" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow_clean" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bg_clean)" stroke="url(#border_clean)" stroke-width="2.5"/>

  <!-- Subtle Center Emerald Glow -->
  <circle cx="50" cy="50" r="28" fill="#10b981" opacity="0.18" filter="url(#glow_clean)"/>

  <!-- Left Curly Bracket { -->
  <path d="M 43 24 C 33 24 30 33 30 40 C 30 46 24 48 21 50 C 24 52 30 54 30 60 C 30 67 33 76 43 76" 
        stroke="url(#braceGrad_clean)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Curly Bracket } -->
  <path d="M 57 24 C 67 24 70 33 70 40 C 70 46 76 48 79 50 C 76 52 70 54 70 60 C 70 67 67 76 57 76" 
        stroke="url(#braceGrad_clean)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
