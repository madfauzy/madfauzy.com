<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="border2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bg2)" stroke="url(#border2)" stroke-width="2.5"/>

  <!-- Server Blades Rack (Classic Datacenter / Backend Infra) -->
  <!-- Top Blade -->
  <rect x="22" y="24" width="56" height="13" rx="5" fill="#161e2e" stroke="url(#blade)" stroke-width="2"/>
  <circle cx="30" cy="30.5" r="2.5" fill="#10b981"/>
  <rect x="38" y="29.5" width="28" height="2" rx="1" fill="#475569"/>

  <!-- Mid Blade -->
  <rect x="22" y="43" width="56" height="13" rx="5" fill="#161e2e" stroke="url(#blade)" stroke-width="2"/>
  <circle cx="30" cy="49.5" r="2.5" fill="#6366f1"/>
  <rect x="38" y="48.5" width="20" height="2" rx="1" fill="#38bdf8"/>
  <circle cx="68" cy="49.5" r="2" fill="#38bdf8"/>

  <!-- Bottom Blade -->
  <rect x="22" y="62" width="56" height="13" rx="5" fill="#161e2e" stroke="url(#blade)" stroke-width="2"/>
  <circle cx="30" cy="68.5" r="2.5" fill="#38bdf8"/>
  <rect x="38" y="67.5" width="28" height="2" rx="1" fill="#475569"/>

  <!-- High-speed interconnect bus line linking blades -->
  <path d="M 64 37 L 64 43" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <path d="M 48 56 L 48 62" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
